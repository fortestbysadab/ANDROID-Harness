# Builds the harness APK on GitHub's runners. No local Android toolchain
# is needed: the ubuntu runner image already ships the Android SDK.
#
# Actions -> Build harness APK -> Run workflow, then download the
# "harness-debug-apk" artifact.

name: Build harness APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    # Pinned rather than ubuntu-latest: the latest label is rolling over to
    # Ubuntu 26.04 and a pinned image keeps this reproducible.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deliberately NOT using android-actions/setup-android: it invokes
      # "sdkmanager tools", a package that no longer exists, and fails
      # before Gradle starts. The runner image already provides the SDK.
      # Chaquopy compiles the bundled Python to bytecode at build time,
      # and bytecode is version-specific: without a matching interpreter
      # on the runner it silently falls back to compiling on the device,
      # at every app start.
      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Use the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Generating the wrapper here pins the Gradle version without
      # committing a binary jar to the repository.
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: harness-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
